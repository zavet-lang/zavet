version: 2

project_name: zavet

builds:
  - id: zavet
    main: .
    binary: zavet
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

nfpms:
  - id: zavet-pkg
    package_name: zavet
    vendor: Zavet
    homepage: https://github.com/zavet-lang/zavet
    maintainer: Zavet Maintainers
    description: Язык программирования Завет на библейском русском
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin

homebrew_casks:
  - name: zavet
    homepage: https://github.com/zavet-lang/zavet
    description: Язык программирования Завет на библейском русском
    license: MIT
    binaries:
      - zavet
    repository:
      owner: zavet-lang
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/zavet"]
          end

scoops:
  - name: zavet
    homepage: https://github.com/zavet-lang/zavet
    description: Язык программирования Завет на библейском русском
    license: MIT
    repository:
      owner: zavet-lang
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"

release:
  mode: keep-existing
  replace_existing_artifacts: true

changelog:
  sort: asc
